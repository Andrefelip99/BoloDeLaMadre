
spring.application.name=BoloDeLaMadre

# Carrega DB_URL, JWT_SECRET e credenciais locais mantidas fora do código.
    spring.config.import=optional:file:./arquivo.env[.properties]

app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

spring.jpa.open-in-view=false

server.port=${PORT:8080}


spring.datasource.url=${DB_URL}


jwt.secret=${JWT_SECRET}

jwt.expiration=86400000


spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
